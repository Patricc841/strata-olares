name: build-image

on:
  workflow_dispatch:
    inputs:
      strata_ref:
        description: niko1221/strata ref (branch, tag or commit) to build
        default: main
      cuda_architectures:
        description: CUDA architectures (120 = RTX 5090 / Blackwell)
        default: "120"
      tag:
        description: image tag
        default: "1.0.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: niko1221/strata
          ref: ${{ inputs.strata_ref }}
          submodules: recursive

      # The Dockerfile builds ggml's CPU backend for the CPU that builds the image (-march=native). A GitHub runner
      # is not the Olares One's Core Ultra 9 275HX (no AVX-512), so the engine died with SIGILL. Portable = AVX2 floor.
      - name: Build the engine portable (AVX2 baseline)
        run: |
          sed -i 's|"-DSTRATA_ENABLE_CUDA=ON",|"-DSTRATA_ENABLE_CUDA=ON", "-DSTRATA_PORTABLE=ON",|; s|"-DSTRATA_PORTABLE=OFF"|"-DSTRATA_PORTABLE=ON"|' Dockerfile
          grep -n "STRATA_PORTABLE" Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/strata-olares:${{ inputs.tag }}
          build-args: |
            CUDA_ARCHITECTURES=${{ inputs.cuda_architectures }}
            BUILD_VISION=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

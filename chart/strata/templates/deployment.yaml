apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: strata
spec:
  replicas: {{ .Values.workloads.strata.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: strata
  template:
    metadata:
      labels:
        io.kompose.service: strata
    spec:
      # the engine releases its page-locked RAM on SIGTERM; docker's default 10 s kills it (exit 137)
      terminationGracePeriodSeconds: 90
      containers:
      - name: strata
        image: {{ .Values.image }}
        ports:
        - containerPort: 8080
        env:
        - name: FAMILY
          value: "{{ .Values.strata.family }}"
        - name: MODEL
          value: "{{ .Values.strata.model }}"
        - name: CONTEXT
          value: "{{ .Values.strata.context }}"
        - name: VISION
          value: "{{ .Values.strata.vision }}"
        - name: KV
          value: "{{ .Values.strata.kv }}"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 30
          failureThreshold: 3
        # first start downloads ~76 GB and prepares the pack: allow up to 3 h
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 30
          failureThreshold: 360
        resources:
          requests:
            cpu: "2"
            memory: 56Gi
          limits:
            cpu: "12"
            memory: 84Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: {{ .Values.userspace.appCache }}/strata
          type: DirectoryOrCreate
